<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego Indie Aeropuerto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    canvas {
      border: 3px solid #fff;
      background: url("fondo.png") no-repeat center center;
      background-size: cover;
      display: block;
      width: 100%;
      max-width: 1080px;     /* pensado para Honor 1080 x 2388 */
      height: 70vh;          /* ligeramente por debajo del centro */
      margin-top: 10vh;
      touch-action: none;    /* control táctil directo */
    }
    .hud {
      position: fixed;
      top: 6px;
      left: 12px;
      color: #fff;
      font: 16px/1 Arial, sans-serif;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Música retro (reemplaza el src por tu archivo) -->
  <audio id="bgMusic" src="musica-retro.mp3" loop></audio>

  <div class="hud">Toca y mantén: izquierda/derecha/arriba/abajo</div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const music = document.getElementById("bgMusic");

    // Reproducción de música tras primer gesto del usuario (requisito móviles)
    let musicAttempted = false;
    function tryPlayMusic() {
      if (!musicAttempted) {
        musicAttempted = true;
        music.play().catch(() => { /* en silencio si el navegador bloquea */ });
      }
    }

    // Ajuste de canvas al tamaño visible
    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Sprites base (sin maleta)
    const reposoImg = new Image(); reposoImg.src = "reposo.png";
    const corriendoDerechaImg = new Image(); corriendoDerechaImg.src = "corriendoderecha.png";
    const corriendoIzquierdaImg = new Image(); corriendoIzquierdaImg.src = "corriendoizquierda.png";

    // Reposo con maleta
    const reposoMaleta = {
      amarillo: "reposo-maletaamarilla.png",
      verde: "reposo-maletaverde.png",
      rojo: "reposo-maletaroja.png",
      azul: "reposo-maletaazul.png"
    };

    // Corriendo con maleta (dirección)
    const maletasCargando = {
      amarillo: { derecha: "maletaamarilla-corriendo-derecha.png", izquierda: "maletaamarilla-corriendo-izquierda.png" },
      verde:    { derecha: "maletaverde-corriendo-derecha.png",    izquierda: "maletaverde-corriendo-izquierda.png" },
      rojo:     { derecha: "maletaroja-corriendo-derecha.png",      izquierda: "maletaroja-corriendo-izquierda.png" },
      azul:     { derecha: "maletaazul-corriendo-derecha.png",      izquierda: "maletaazul-corriendo-izquierda.png" }
    };

    // Maletas en el suelo (estáticas)
    const maletasSuelo = {
      amarillo: "maleta-amarilla.png",
      verde:    "maleta-verde.png",
      rojo:     "maleta-roja.png",
      azul:     "maleta-azul.png"
    };

    // Contenedores (posiciones relativas; se actualizarán en resize)
    let zonas = makeZonas();
    function makeZonas() {
      return {
        amarillo: { x: canvas.width - 100, y: 50,  w: 60, h: 60, img: "contenedoramarillo.png" },
        verde:    { x: canvas.width - 100, y: 150, w: 60, h: 60, img: "contenedorverde.png" },
        rojo:     { x: canvas.width - 100, y: 250, w: 60, h: 60, img: "contenedorrojo.png" },
        azul:     { x: canvas.width - 100, y: 350, w: 60, h: 60, img: "contenedorazul.png" }
      };
    }
    window.addEventListener("resize", () => { zonas = makeZonas(); });

    // Personaje
    let player = { x: 50, y: 200, width: 50, height: 80 };
    let playerImg = new Image();
    playerImg.src = reposoImg.src;
    let direccion = "derecha";
    let maletaActual = null;
    let puntos = 0;

    // Maletas del mapa
    const MAL_W = 48, MAL_H = 48; // 20% más grandes (antes 40)
    let objetos = [
      { x: 100, y: 100, color: "amarillo" },
      { x: 200, y: 150, color: "verde" },
      { x: 300, y: 200, color: "rojo" },
      { x: 150, y: 300, color: "azul" },
      { x: 250, y: 350, color: "amarillo" },
      { x: 350, y: 400, color: "verde" },
      { x: 450, y: 250, color: "rojo" },
      { x: 550, y: 150, color: "azul" }
    ];

    // Movimiento continuo por presión
    let activeDirection = null;
    const MOVE_STEP = 5;

    function setDirectionFromTouch(touch) {
      const rect = canvas.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      const y = touch.clientY - rect.top;

      // Tocar y mantener: izquierda/derecha/arriba/abajo
      if (x < canvas.width / 3) {
        activeDirection = "izquierda";
      } else if (x > (canvas.width * 2) / 3) {
        activeDirection = "derecha";
      } else if (y < canvas.height / 3) {
        activeDirection = "arriba";
      } else if (y > (canvas.height * 2) / 3) {
        activeDirection = "abajo";
      } else {
        activeDirection = null;
      }
    }

    canvas.addEventListener("touchstart", function(e) {
      tryPlayMusic();
      e.preventDefault();
      const touch = e.touches[0];
      setDirectionFromTouch(touch);
    });

    canvas.addEventListener("touchmove", function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      setDirectionFromTouch(touch);
    });

    canvas.addEventListener("touchend", function(e) {
      e.preventDefault();
      activeDirection = null;
      // reposo automático
      if (maletaActual) playerImg.src = reposoMaleta[maletaActual];
      else playerImg.src = reposoImg.src;
    });

    canvas.addEventListener("touchcancel", function(e) {
      e.preventDefault();
      activeDirection = null;
      if (maletaActual) playerImg.src = reposoMaleta[maletaActual];
      else playerImg.src = reposoImg.src;
    });

    function update() {
      // Movimiento continuo si hay dirección activa
      if (activeDirection) {
        if (activeDirection === "izquierda") {
          player.x = Math.max(0, player.x - MOVE_STEP);
          direccion = "izquierda";
        }
        if (activeDirection === "derecha") {
          player.x = Math.min(canvas.width - player.width, player.x + MOVE_STEP);
          direccion = "derecha";
        }
        if (activeDirection === "arriba") {
          player.y = Math.max(0, player.y - MOVE_STEP);
        }
        if (activeDirection === "abajo") {
          player.y = Math.min(canvas.height - player.height, player.y + MOVE_STEP);
        }

        // sprite corriendo
        if (maletaActual) {
          playerImg.src = maletasCargando[maletaActual][direccion];
        } else {
          playerImg.src = direccion === "derecha" ? corriendoDerechaImg.src : corriendoIzquierdaImg.src;
        }
      }

      // Colisión con maletas del suelo
      for (let i = objetos.length - 1; i >= 0; i--) {
        const obj = objetos[i];
        if (!maletaActual &&
            player.x < obj.x + MAL_W &&
            player.x + player.width > obj.x &&
            player.y < obj.y + MAL_H &&
            player.y + player.height > obj.y) {
          maletaActual = obj.color;
          objetos.splice(i, 1);
          playerImg.src = reposoMaleta[maletaActual];
        }
      }

      // Entrega en contenedor correspondiente
      if (maletaActual) {
        const zona = zonas[maletaActual];
        if (player.x < zona.x + zona.w &&
            player.x + player.width > zona.x &&
            player.y < zona.y + zona.h &&
            player.y + player.height > zona.y) {
          puntos += 10;
          maletaActual = null;
          // reposo sin maleta
          if (!activeDirection) playerImg.src = reposoImg.src;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Personaje
      ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

      // Maletas en el suelo (estáticas y 20% más grandes)
      objetos.forEach(obj => {
        const img = new Image();
        img.src = maletasSuelo[obj.color];
        ctx.drawImage(img, obj.x, obj.y, MAL_W, MAL_H);
      });

      // Contenedores
      Object.keys(zonas).forEach(color => {
        const z = zonas[color];
        const img = new Image();
        img.src = z.img;
        ctx.drawImage(img, z.x, z.y, z.w, z.h);
      });

      // Puntaje
      ctx.font = "18px Arial";
      ctx.fillStyle = "#fff";
      ctx.fillText("Puntos: " + puntos, 20, 30);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
