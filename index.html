<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego Indie Aeropuerto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      width: 100vw;
    }
    canvas {
      border: 3px solid #fff;
      background: url("fondo.png") no-repeat center center;
      background-size: cover;
      display: block;
      width: 100%;
      max-width: 1080px; /* pensado para tu Honor */
      height: 70vh;
      margin-top: 10vh; /* un poco más abajo del centro */
      touch-action: manipulation; /* mejora respuestas táctiles */
    }
  </style>
</head>
<body>
  <!-- Música retro opcional: reemplaza el src si quieres usarla -->
  <audio id="bgMusic" src="musica-retro.mp3" autoplay loop></audio>

  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Sprites base (sin maleta)
    const reposoImg = new Image();
    reposoImg.src = "reposo.png";

    const corriendoDerechaImg = new Image();
    corriendoDerechaImg.src = "corriendoderecha.png";

    const corriendoIzquierdaImg = new Image();
    corriendoIzquierdaImg.src = "corriendoizquierda.png";

    // Reposo con maleta
    const reposoMaleta = {
      amarillo: "reposo-maletaamarilla.png",
      verde: "reposo-maletaverde.png",
      rojo: "reposo-maletaroja.png",
      azul: "reposo-maletaazul.png"
    };

    // Corriendo con maleta (dirección)
    const maletasCargando = {
      amarillo: {
        derecha: "maletaamarilla-corriendo-derecha.png",
        izquierda: "maletaamarilla-corriendo-izquierda.png"
      },
      verde: {
        derecha: "maletaverde-corriendo-derecha.png",
        izquierda: "maletaverde-corriendo-izquierda.png"
      },
      rojo: {
        derecha: "maletaroja-corriendo-derecha.png",
        izquierda: "maletaroja-corriendo-izquierda.png"
      },
      azul: {
        derecha: "maletaazul-corriendo-derecha.png",
        izquierda: "maletaazul-corriendo-izquierda.png"
      }
    };

    // Maletas en el suelo (estáticas)
    const maletasSuelo = {
      amarillo: "maleta-amarilla.png",
      verde: "maleta-verde.png",
      rojo: "maleta-roja.png",
      azul: "maleta-azul.png"
    };

    // Contenedores (posiciones relativas a pantalla)
    let zonas = {
      amarillo: { x: canvas.width - 100, y: 50, w: 60, h: 60, img: "contenedoramarillo.png" },
      verde: { x: canvas.width - 100, y: 150, w: 60, h: 60, img: "contenedorverde.png" },
      rojo: { x: canvas.width - 100, y: 250, w: 60, h: 60, img: "contenedorrojo.png" },
      azul: { x: canvas.width - 100, y: 350, w: 60, h: 60, img: "contenedorazul.png" }
    };

    // Personaje
    let player = { x: 50, y: 200, width: 50, height: 80 };
    let playerImg = new Image();
    let direccion = "derecha"; // "izquierda" | "derecha"
    let maletaActual = null;
    let puntos = 0;

    // Maletas en el mapa (más cantidad)
    const MAL_W = 48, MAL_H = 48; // 20% más grandes
    let objetos = [
      { x: 100, y: 100, color: "amarillo" },
      { x: 200, y: 150, color: "verde" },
      { x: 300, y: 200, color: "rojo" },
      { x: 150, y: 300, color: "azul" },
      { x: 250, y: 350, color: "amarillo" },
      { x: 350, y: 400, color: "verde" },
      { x: 450, y: 250, color: "rojo" },
      { x: 550, y: 150, color: "azul" }
    ];

    // Controles táctiles por zonas: izquierda/derecha/arriba/abajo
    const MOVE_STEP = 20;
    function handleTouch(x, y) {
      let moved = false;
      if (x < canvas.width / 3) {
        player.x = Math.max(0, player.x - MOVE_STEP);
        direccion = "izquierda";
        moved = true;
      } else if (x > (canvas.width * 2) / 3) {
        player.x = Math.min(canvas.width - player.width, player.x + MOVE_STEP);
        direccion = "derecha";
        moved = true;
      } else if (y < canvas.height / 3) {
        player.y = Math.max(0, player.y - MOVE_STEP);
        moved = true;
      } else if (y > (canvas.height * 2) / 3) {
        player.y = Math.min(canvas.height - player.height, player.y + MOVE_STEP);
        moved = true;
      }

      // Actualizar sprite a "corriendo" si se movió
      if (moved) {
        if (maletaActual) {
          playerImg.src = maletasCargando[maletaActual][direccion];
        } else {
          playerImg.src = direccion === "derecha" ? corriendoDerechaImg.src : corriendoIzquierdaImg.src;
        }
      } else {
        // sin movimiento → reposo
        if (maletaActual) {
          playerImg.src = reposoMaleta[maletaActual];
        } else {
          playerImg.src = reposoImg.src;
        }
      }
    }

    canvas.addEventListener("touchstart", function(e) {
      const touch = e.touches[0];
      // traducir a coordenadas relativas al canvas
      const rect = canvas.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      const y = touch.clientY - rect.top;
      handleTouch(x, y);
    });

    // también permitir arrastrar/slide
    canvas.addEventListener("touchmove", function(e) {
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      const y = touch.clientY - rect.top;
      handleTouch(x, y);
    });

    // Inicial: reposo sin maleta
    playerImg.src = reposoImg.src;

    function update() {
      // Colisión con maletas en el suelo
      for (let i = objetos.length - 1; i >= 0; i--) {
        const obj = objetos[i];
        if (!maletaActual &&
            player.x < obj.x + MAL_W &&
            player.x + player.width > obj.x &&
            player.y < obj.y + MAL_H &&
            player.y + player.height > obj.y) {
          // recoger maleta
          maletaActual = obj.color;
          objetos.splice(i, 1);
          // al recoger y no moverse, mostrar reposo con maleta
          playerImg.src = reposoMaleta[maletaActual];
        }
      }

      // Entregar maleta en contenedor correspondiente
      if (maletaActual) {
        const zona = zonas[maletaActual];
        if (player.x < zona.x + zona.w &&
            player.x + player.width > zona.x &&
            player.y < zona.y + zona.h &&
            player.y + player.height > zona.y) {
          puntos += 10;
          maletaActual = null;
          // tras entregar, si no hay movimiento, reposo sin maleta
          playerImg.src = reposoImg.src;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar personaje
      ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

      // Dibujar maletas en el suelo (estáticas y más grandes)
      objetos.forEach(obj => {
        const img = new Image();
        img.src = maletasSuelo[obj.color];
        ctx.drawImage(img, obj.x, obj.y, MAL_W, MAL_H);
      });

      // Dibujar contenedores
      Object.keys(zonas).forEach(color => {
        const z = zonas[color];
        const img = new Image();
        img.src = z.img;
        ctx.drawImage(img, z.x, z.y, z.w, z.h);
      });

      // Puntaje
      ctx.font = "18px Arial";
      ctx.fillStyle = "#fff";
      ctx.fillText("Puntos: " + puntos, 20, 30);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // Reajustar posiciones dependientes del tamaño al redimensionar
    window.addEventListener("resize", () => {
      zonas = {
        amarillo: { x: canvas.width - 100, y: 50,  w: 60, h: 60, img: "contenedoramarillo.png" },
        verde:    { x: canvas.width - 100, y: 150, w: 60, h: 60, img: "contenedorverde.png" },
        rojo:     { x: canvas.width - 100, y: 250, w: 60, h: 60, img: "contenedorrojo.png" },
        azul:     { x: canvas.width - 100, y: 350, w: 60, h: 60, img: "contenedorazul.png" }
      };
    });
  </script>
</body>
</html>
